name: CI

on:
  push:
    branches: [ yolo ]
  pull_request:
    branches: [ yolo, main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint & type-check
        run: |
          pre-commit run -a
      - name: Run tests
        run: |
          python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          cd src
          docker build -t ecovid-app .
      - name: Login to GHCR
        if: github.event_name == 'push'
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo $CR_PAT | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Tag & Push
        if: github.event_name == 'push'
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/ecovid-app:latest
          docker tag ecovid-app $IMAGE
          docker push $IMAGE
