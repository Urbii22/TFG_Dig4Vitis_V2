name: CI

on:
  push:
    branches: [ yolo ]
  pull_request:
    branches: [ yolo, main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]
      - name: Lint & type-check
        run: |
          pre-commit run -a
      - name: Run tests
        run: |
          python -m pytest -q
